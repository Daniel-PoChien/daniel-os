name: Deploy Daniel OS to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate filesystem and desktop JavaScript
        run: |
          node --test tests/filesystem.test.mjs
          node --check web/app.js
          node --check web/workspace.mjs
          node --check web/filesystem.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
